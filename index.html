<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./preview.js" defer type="module"></script>
    <title>Preview de Imagens</title>
</head>
<body>
    <header>
        <h1>Preview de Imagens</h1>
    </header>
    <main>
        <form>
            <div class="preview-container">
                <input id="preview-input" class="preview-input" type="file" accept="image/*">
                <label class="preview-label" for="preview-input"></label>
                <img id="preview-image" class="preview-image" src="./img/upload-icon.svg" alt="Selecione uma imagem">
            </div>
            <div class="button-container">
                <button class="button" type="button" id="upload-button">Salvar</button>
                <button class="button" type="button" id="cancel-button">Cancelar</button>
            </div>
        </form>
        <p class="resultado" id="resultado"></p>
    </main>
    <footer>
        <p>&copy; 2026 |</p>
        <a href="https://github.com/bryantheconnlr-art" target="_blank" rel="noopener">bryantheconnlr-art</a>
    </footer>
</body>
</html>
